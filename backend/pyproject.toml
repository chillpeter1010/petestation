[project]
name = "baseball-analysis-backend"
version = "0.1.0"
description = "FastAPI backend for baseball analysis pages."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "duckdb>=1.0.0",
  "numpy>=2.0.0",
  "uvicorn[standard]>=0.30.0",
  "pandas>=2.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "pybaseball>=2.2.7",
  "requests>=2.32.0",
  "joblib>=1.4.0",
  "scikit-learn==1.8.0",
  "xgboost==3.2.0",
  "hmmlearn==0.3.3",
  "arch==8.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
